name: Build and deploy snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task selector; empty runs the full suite'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-deploy-snapshot:
    name: Build and deploy snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: 17
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5
        with:
          cache-read-only: false
      - name: Configure Gradle properties
        shell: bash
        run: |
          mkdir -p $HOME/.gradle
          echo 'systemProp.user.name=spring-builds+github' >> $HOME/.gradle/gradle.properties
          echo 'systemProp.org.gradle.internal.launcher.welcomeMessageEnabled=false' >> $HOME/.gradle/gradle.properties
          echo 'org.gradle.daemon=false' >> $HOME/.gradle/gradle.properties
          echo 'org.gradle.daemon=4' >> $HOME/.gradle/gradle.properties
      - name: Enable Test Result Logging
        uses: ./.github/actions/seal-test-report
        with:
          mode: setup
      - name: Build and publish
        id: build
        env:
          CI: 'true'
          GRADLE_ENTERPRISE_URL: 'https://ge.spring.io'
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
          GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USER }}
          GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew -PdeploymentRepository=$(pwd)/deployment-repository assemble publishAllPublicationsToDeploymentRepository ${{ inputs.test-filter }}
          else
            ./gradlew -PdeploymentRepository=$(pwd)/deployment-repository build publishAllPublicationsToDeploymentRepository
          fi
      - name: Upload spring-core jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-core-jar
          path: |
            deployment-repository/org/springframework/spring-core/*/spring-core-*.jar
            !deployment-repository/**/*-sources.jar
            !deployment-repository/**/*-javadoc.jar
            !deployment-repository/**/*-test-fixtures.jar
          if-no-files-found: error
      - name: Report Skipped Tests
        if: ${{ !cancelled() }}
        uses: ./.github/actions/seal-test-report
        with:
          mode: report